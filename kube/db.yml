apiVersion: v1
kind: Service
metadata:
  name: np-db

spec:
  selector:
    app: np-db
  ports:
    - name: db
      port: 5432
      targetPort: db

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: np-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: np-db
  template:
    metadata:
      labels:
        app: np-db
    spec:
      containers:
        - name: np-db
          image: postgis/postgis:13-master
          env:
            - name: POSTGRES_PASSWORD
              value: passwd
            - name: POSTGRES_DB
              value: natural-presence
            - name: POSTGRES_USER
              value: natural-presence
          ports:
            - name: db
              containerPort: 5432
